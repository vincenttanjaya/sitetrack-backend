name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sitetrack
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: sitetrack_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sitetrack -d sitetrack_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - run: test -z "$(gofmt -l cmd internal migrations)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://sitetrack:ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/sitetrack_test?sslmode=disable
      - run: go build ./...
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up --build --wait
      - run: |
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS http://127.0.0.1:8080/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI test","email":"ci@example.test","password":"ci-smoke-password","role":"user"}'
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
